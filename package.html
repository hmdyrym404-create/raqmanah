<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>طلب الباقة | رقمنه</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="preview-page">

    <!-- الشريط العلوي -->
    <nav class="navbar">
        <div class="container nav-content">

            <a href="index.html" class="logo">
                رقمنه
            </a>

            <div class="nav-links">
                <a href="index.html">الرئيسية</a>
                <a href="index.html#about">عن رقمنه</a>
                <a href="index.html#services">خدماتنا</a>
                <a href="index.html#pricing">الباقات</a>
                <a href="index.html#contact">تواصل معنا</a>
            </div>

        </div>
    </nav>


    <!-- محتوى الصفحة -->
    <main class="preview-main">

        <div class="container">

            <div class="preview-heading">

                <span>اختيارك تم بنجاح 🎉</span>

                <h1>اطلب موقعك الآن</h1>

                <p>
                    أكمل بياناتك وسنتواصل معك بخصوص تنفيذ موقعك.
                </p>

            </div>


            <!-- بيانات الباقة -->
            <div class="builder-box">

                <div class="builder-form">

                    <h2 id="selectedPackage">
                        الباقة المختارة
                    </h2>

                    <p id="selectedPrice">
                        السعر
                    </p>


                    <!-- الاسم -->
                    <label for="customerName">
                        الاسم
                    </label>

                    <input
                        type="text"
                        id="customerName"
                        placeholder="اكتب اسمك"
                    >

                    <small
                        class="field-error"
                        id="nameError">
                    </small>


                    <!-- الجوال -->
                    <label for="customerPhone">
                        رقم الجوال
                    </label>

                    <input
                        type="tel"
                        id="customerPhone"
                        placeholder="05xxxxxxxx"
                    >

                    <small
                        class="field-error"
                        id="phoneError">
                    </small>


                    <!-- اسم المشروع -->
                    <label for="projectName">
                        اسم المشروع
                    </label>

                    <input
                        type="text"
                        id="projectName"
                        placeholder="اكتب اسم مشروعك"
                    >

                    <small
                        class="field-error"
                        id="projectError">
                    </small>


                    <!-- زر الإرسال -->
                    <button
                        type="button"
                        class="create-button"
                        onclick="sendPackageRequest()">

                        إرسال الطلب

                    </button>


                    <!-- رسالة النجاح -->
                    <p
                        class="success-message"
                        id="successMessage">
                    </p>

                </div>

            </div>

        </div>

    </main>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
